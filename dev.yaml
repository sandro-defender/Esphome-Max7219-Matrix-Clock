# Local development entry point.
#
# Uses the package modules straight from this checkout, so no GitHub round trip
# and no network access is needed for `esphome config` / `esphome compile`:
#
#   cp secrets.yaml.example secrets.yaml   # then fill in your own values
#   esphome config dev.yaml
#   esphome compile dev.yaml
#
# `scripts/validate.ps1` and tests/test_config.py use this file as the local
# development configuration. The published example lives in examples/.

substitutions:
  # Credentials never live in the packages: a remote package cannot resolve
  # !secret itself, so the local YAML resolves them and passes them down.
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret api_encryption_key
  fallback_ap_password: !secret fallback_ap_password
  web_server_username: !secret web_server_username
  web_server_password: !secret web_server_password

  # --- Uncomment and change to fit your hardware ---------------------------
  # board: nodemcuv2
  # matrix_chips: "6"
  # matrix_rows: "1"
  # matrix_clk_pin: D8
  # matrix_mosi_pin: D6
  # matrix_cs_pin: D7
  # timezone: Europe/Berlin

packages:
  base: !include packages/base.yaml
  network: !include packages/network.yaml
  renderer: !include packages/renderer.yaml
  defaults: !include packages/restore_defaults.generated.yaml
  display: !include packages/display.yaml
  visibility: !include packages/entity_visibility.yaml
  controls: !include packages/controls.yaml
  buttons: !include packages/buttons.yaml
  date_controls: !include packages/date_controls.yaml
  actions: !include packages/actions.yaml
  diagnostics: !include packages/diagnostics.yaml
  ota_ui: !include packages/ota_ui.yaml
  web_server: !include packages/web_server.yaml
  boot_ui: !include packages/boot_ui.yaml
  fonts: !include packages/fonts_default_local.yaml
