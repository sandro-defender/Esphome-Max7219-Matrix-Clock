# GENERATED ESP-WROOM-32 DevKit installer. Copy beside your local secrets.yaml.
# Defaults: esp32dev; MAX7219 CLK GPIO18, DIN GPIO23, CS GPIO5.
substitutions:
  wifi_ssid: !secret 'wifi_ssid'
  wifi_password: !secret 'wifi_password'
  api_encryption_key: !secret 'api_encryption_key'
  fallback_ap_password: !secret 'fallback_ap_password'
  web_server_username: !secret 'web_server_username'
  web_server_password: !secret 'web_server_password'
  project_ref: 0.8.3
packages:
  clock:
    url: https://github.com/sandro-defender/Esphome-Max7219-Matrix-Clock
    ref: 0.8.3
    refresh: 1d
    files:
    - packages/base-esp32.yaml
    - packages/network.yaml
    - packages/renderer.yaml
    - packages/restore_defaults.generated.yaml
    - packages/display.yaml
    - packages/entity_visibility.yaml
    - packages/controls.yaml
    - packages/buttons.yaml
    - packages/date_controls.yaml
    - packages/actions.yaml
    - packages/diagnostics.yaml
    - packages/ota_ui.yaml
    - packages/web_server.yaml
    - packages/boot_ui.yaml
    - packages/fonts/pixel-clock-6x8.yaml
    - packages/fonts/matrix-2px.yaml
