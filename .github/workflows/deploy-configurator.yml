name: Deploy web configurator

on:
  push:
    branches: [main]
    paths:
      - "web-configurator/**"
      - ".github/workflows/deploy-configurator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-configurator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rasteriser dependencies
        run: pip install pyyaml pillow

      - name: Check the generated font preview bitmaps
        run: python3 scripts/generate_glyphs.py --check

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-configurator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test YAML generator
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-configurator/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
