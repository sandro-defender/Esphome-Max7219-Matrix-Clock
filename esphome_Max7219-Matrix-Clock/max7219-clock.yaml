# Board: Wemos D1 Mini (ESP8266) (Wemos)
# Definition: definitions/boards/d1_mini/manifest.yaml
#--------------------------------------------------------------------
# MAX7219 Clock — firmware v2.0
#
#   New in this version:
#     - Seconds counter on the clock face (tiny 3x5 digits or a
#       full-width progress bar along the bottom row)
#     - Receive scrolling messages from Home Assistant through the
#       native API: action esphome.max7219_clock_show_message
#     - Date screen (DD.MM), 12/24 h format, switchable blinking colon
#--------------------------------------------------------------------

substitutions:
  device_name: max7219-clock
  friendly_name: MAX7219 Clock

  # ----- Hardware: change these, then upload the firmware again -----
  # Default is a NodeMCU ESP8266 board. D6/D7/D8 are NodeMCU pin labels.
  esp8266_board: nodemcuv2
  matrix_clk_pin: D8
  matrix_mosi_pin: D6
  matrix_cs_pin: D7

  # ----- Physical matrix layout: change these, then upload again -----
  # Six modules in one row: matrix_chips: "6", matrix_rows: "1" = 48x8 pixels
  # Twelve modules in one row: matrix_chips: "12", matrix_rows: "1" = 96x8 pixels
  # Twelve modules in two rows: matrix_chips: "12", matrix_rows: "2" = 48x16 pixels
  matrix_chips: "6"
  matrix_rows: "1"
  matrix_wiring: snake       # For two or more rows: snake or zigzag
  matrix_rotate_chip: "0"    # 0, 90, 180, or 270
  matrix_flip_x: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(matrix).intensity((uint8_t) id(matrix_brightness).state);
      - component.update: matrix

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Actions callable from Home Assistant (Developer tools > Actions):
  #   esphome.max7219_clock_show_message   {message: "Hello", duration: 15}
  #   esphome.max7219_clock_clear_message
  services:
    - service: show_message
      variables:
        message: string
        duration: int
      then:
        - lambda: |-
            std::string text = message;
            if (text.empty()) return;
            if (duration <= 0) duration = 15;
            for (auto &character : text) character = (char) toupper(character);
            id(message_text) = text;
            id(message_scroll) = 0;
            id(message_off_at) = millis() + (uint32_t) duration * 1000UL;
            id(screen_mode).publish_state("Message");
        - component.update: matrix
    - service: clear_message
      then:
        - lambda: |-
            id(message_off_at) = 0;
            id(screen_mode).publish_state("Clock");
        - component.update: matrix

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: MAX7219 Clock Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

# Lets you use the same controls from the ESP's own browser page too.
web_server:
  version: 3

time:
  - platform: homeassistant
    id: home_time

# Shared state for the message screen (text, expiry, scroll position).
globals:
  - id: message_text
    type: std::string
    restore_value: no
    initial_value: '"HELLO FROM HOME ASSISTANT"'
  - id: message_off_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: message_scroll
    type: int
    restore_value: no
    initial_value: '0'

spi:
  clk_pin: ${matrix_clk_pin}
  mosi_pin: ${matrix_mosi_pin}

select:
  - platform: template
    name: "Screen"
    id: screen_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Clock"
    options:
      - "Clock"
      - "Date"
      - "Message"
      - "Module grid test"
      - "Pixel checkerboard"
    set_action:
      - lambda: |-
          id(message_scroll) = 0;
      - component.update: matrix

  - platform: template
    name: "Clock alignment"
    id: clock_alignment
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Center"
    options:
      - "Left"
      - "Center"
      - "Right"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Time format"
    id: time_format
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "24 hour"
    options:
      - "24 hour"
      - "12 hour"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Seconds display"
    id: seconds_display
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Digits"
    options:
      - "Off"
      - "Digits"
      - "Bar"
    set_action:
      - component.update: matrix

number:
  - platform: template
    name: "Matrix brightness"
    id: matrix_brightness
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 0
    max_value: 15
    step: 1
    set_action:
      - lambda: |-
          id(matrix).intensity((uint8_t) x);

switch:
  - platform: template
    name: "Matrix display"
    id: matrix_display_power
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(matrix).turn_on_off(true);
    turn_off_action:
      - lambda: |-
          id(matrix).turn_on_off(false);

  - platform: template
    name: "Blinking colon"
    id: clock_blink
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - component.update: matrix
    turn_off_action:
      - component.update: matrix

display:
  - platform: max7219digit
    id: matrix
    cs_pin: ${matrix_cs_pin}
    num_chips: ${matrix_chips}
    num_chip_lines: ${matrix_rows}
    chip_lines_style: ${matrix_wiring}
    rotate_chip: ${matrix_rotate_chip}
    flip_x: ${matrix_flip_x}
    intensity: 3
    scroll_enable: false
    # 150 ms: fast enough for silky message scrolling, easy on the ESP8266.
    update_interval: 150ms
    lambda: |-
      it.fill(COLOR_OFF);
      const int width = it.get_width();
      const int height = it.get_height();
      const uint32_t now_ms = millis();
      std::string mode = id(screen_mode).current_option();

      // Return to the clock once the message time is up. The subtraction is
      // safe against the millis() rollover that happens every ~49 days.
      if (mode == "Message" && (int32_t)(now_ms - id(message_off_at)) >= 0) {
        id(screen_mode).publish_state("Clock");
        mode = "Clock";
      }

      // --- Test modes -------------------------------------------------------
      if (mode == "Pixel checkerboard") {
        for (int y = 0; y < height; y++) {
          for (int x = 0; x < width; x++) {
            if ((x + y) % 2 == 0) it.draw_pixel_at(x, y, COLOR_ON);
          }
        }
        return;
      }

      if (mode == "Module grid test") {
        for (int y = 0; y < height; y += 8) {
          for (int x = 0; x < width; x += 8) {
            it.line(x, y, x + 7, y, COLOR_ON);
            it.line(x, y, x, y + 7, COLOR_ON);
            it.line(x + 7, y, x + 7, y + 7, COLOR_ON);
            it.line(x, y + 7, x + 7, y + 7, COLOR_ON);
            it.draw_pixel_at(x + 2, y + 2, COLOR_ON);
          }
        }
        return;
      }

      // --- Pixel fonts ------------------------------------------------------
      // Compact 5x7 digits keep the clock sharp on an 8-pixel-high matrix.
      static const uint8_t DIGITS[10][7] = {
        {0b01110, 0b10001, 0b10011, 0b10101, 0b11001, 0b10001, 0b01110}, // 0
        {0b00100, 0b01100, 0b00100, 0b00100, 0b00100, 0b00100, 0b01110}, // 1
        {0b01110, 0b10001, 0b00001, 0b00010, 0b00100, 0b01000, 0b11111}, // 2
        {0b11110, 0b00001, 0b00001, 0b01110, 0b00001, 0b00001, 0b11110}, // 3
        {0b00010, 0b00110, 0b01010, 0b10010, 0b11111, 0b00010, 0b00010}, // 4
        {0b11111, 0b10000, 0b10000, 0b11110, 0b00001, 0b00001, 0b11110}, // 5
        {0b00110, 0b01000, 0b10000, 0b11110, 0b10001, 0b10001, 0b01110}, // 6
        {0b11111, 0b00001, 0b00010, 0b00100, 0b01000, 0b01000, 0b01000}, // 7
        {0b01110, 0b10001, 0b10001, 0b01110, 0b10001, 0b10001, 0b01110}, // 8
        {0b01110, 0b10001, 0b10001, 0b01111, 0b00001, 0b00010, 0b11100}  // 9
      };

      // Tiny 3x5 digits for the seconds counter.
      static const uint8_t DIGITS_SMALL[10][5] = {
        {0b111, 0b101, 0b101, 0b101, 0b111}, // 0
        {0b010, 0b110, 0b010, 0b010, 0b111}, // 1
        {0b111, 0b001, 0b111, 0b100, 0b111}, // 2
        {0b111, 0b001, 0b111, 0b001, 0b111}, // 3
        {0b101, 0b101, 0b111, 0b001, 0b001}, // 4
        {0b111, 0b100, 0b111, 0b001, 0b111}, // 5
        {0b111, 0b100, 0b111, 0b101, 0b111}, // 6
        {0b111, 0b001, 0b001, 0b001, 0b001}, // 7
        {0b111, 0b101, 0b111, 0b101, 0b111}, // 8
        {0b111, 0b101, 0b111, 0b001, 0b111}  // 9
      };

      // 5x7 capitals for scrolling messages.
      static const uint8_t LETTERS[26][7] = {
        {0b01110, 0b10001, 0b10001, 0b11111, 0b10001, 0b10001, 0b10001}, // A
        {0b11110, 0b10001, 0b10001, 0b11110, 0b10001, 0b10001, 0b11110}, // B
        {0b01110, 0b10001, 0b10000, 0b10000, 0b10000, 0b10001, 0b01110}, // C
        {0b11100, 0b10010, 0b10001, 0b10001, 0b10001, 0b10010, 0b11100}, // D
        {0b11111, 0b10000, 0b10000, 0b11110, 0b10000, 0b10000, 0b11111}, // E
        {0b11111, 0b10000, 0b10000, 0b11110, 0b10000, 0b10000, 0b10000}, // F
        {0b01110, 0b10001, 0b10000, 0b10111, 0b10001, 0b10001, 0b01110}, // G
        {0b10001, 0b10001, 0b10001, 0b11111, 0b10001, 0b10001, 0b10001}, // H
        {0b01110, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b01110}, // I
        {0b00111, 0b00010, 0b00010, 0b00010, 0b00010, 0b10010, 0b01100}, // J
        {0b10001, 0b10010, 0b10100, 0b11000, 0b10100, 0b10010, 0b10001}, // K
        {0b10000, 0b10000, 0b10000, 0b10000, 0b10000, 0b10000, 0b11111}, // L
        {0b10001, 0b11011, 0b10101, 0b10101, 0b10001, 0b10001, 0b10001}, // M
        {0b10001, 0b10001, 0b11001, 0b10101, 0b10011, 0b10001, 0b10001}, // N
        {0b01110, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01110}, // O
        {0b11110, 0b10001, 0b10001, 0b11110, 0b10000, 0b10000, 0b10000}, // P
        {0b01110, 0b10001, 0b10001, 0b10001, 0b10101, 0b10010, 0b01101}, // Q
        {0b11110, 0b10001, 0b10001, 0b11110, 0b10100, 0b10010, 0b10001}, // R
        {0b01111, 0b10000, 0b10000, 0b01110, 0b00001, 0b00001, 0b11110}, // S
        {0b11111, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100}, // T
        {0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01110}, // U
        {0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01010, 0b00100}, // V
        {0b10001, 0b10001, 0b10001, 0b10101, 0b10101, 0b11011, 0b10001}, // W
        {0b10001, 0b10001, 0b01010, 0b00100, 0b01010, 0b10001, 0b10001}, // X
        {0b10001, 0b10001, 0b01010, 0b00100, 0b00100, 0b00100, 0b00100}, // Y
        {0b11111, 0b00001, 0b00010, 0b00100, 0b01000, 0b10000, 0b11111}  // Z
      };

      auto draw_big_digit = [&](int digit, int x, int y) {
        for (int row = 0; row < 7; row++)
          for (int col = 0; col < 5; col++)
            if (DIGITS[digit][row] & (1 << (4 - col)))
              it.draw_pixel_at(x + col, y + row, COLOR_ON);
      };

      auto draw_small_digit = [&](int digit, int x, int y) {
        for (int row = 0; row < 5; row++)
          for (int col = 0; col < 3; col++)
            if (DIGITS_SMALL[digit][row] & (1 << (2 - col)))
              it.draw_pixel_at(x + col, y + row, COLOR_ON);
      };

      auto draw_glyph = [&](char c, int x, int y) {
        static const uint8_t DOT[7]    = {0b00000, 0b00000, 0b00000, 0b00000, 0b00000, 0b01100, 0b01100};
        static const uint8_t DASH[7]   = {0b00000, 0b00000, 0b00000, 0b01110, 0b00000, 0b00000, 0b00000};
        static const uint8_t COLON[7]  = {0b00000, 0b01100, 0b01100, 0b00000, 0b01100, 0b01100, 0b00000};
        static const uint8_t QUEST[7]  = {0b01110, 0b10001, 0b00001, 0b00010, 0b00100, 0b00000, 0b00100};
        static const uint8_t EXCL[7]   = {0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00000, 0b00100};
        static const uint8_t QUOTE[7]  = {0b00100, 0b00100, 0b01000, 0b00000, 0b00000, 0b00000, 0b00000};
        static const uint8_t BLANK[7]  = {0, 0, 0, 0, 0, 0, 0};
        const uint8_t *glyph;
        if (c >= '0' && c <= '9') glyph = DIGITS[c - '0'];
        else if (c >= 'A' && c <= 'Z') glyph = LETTERS[c - 'A'];
        else {
          switch (c) {
            case '.': case ',': glyph = DOT;   break;
            case '-': case '_': glyph = DASH;  break;
            case ':':           glyph = COLON; break;
            case '?':           glyph = QUEST; break;
            case '!':           glyph = EXCL;  break;
            case '\'':          glyph = QUOTE; break;
            default:            glyph = BLANK; break;
          }
        }
        for (int row = 0; row < 7; row++)
          for (int col = 0; col < 5; col++)
            if (glyph[row] & (1 << (4 - col)))
              it.draw_pixel_at(x + col, y + row, COLOR_ON);
      };

      // --- Message screen: text scrolls in from the right -------------------
      if (mode == "Message") {
        const std::string &text = id(message_text);
        const int loop_width = width + (int) text.length() * 6 + 6;
        if (id(message_scroll) > loop_width) id(message_scroll) = 0;
        const int origin_x = width - id(message_scroll);
        const int start_y = std::max(0, (height - 7) / 2);
        for (int i = 0; i < (int) text.length(); i++) {
          int x = origin_x + i * 6;
          if (x <= -6 || x >= width) continue;
          draw_glyph((char) toupper(text[i]), x, start_y);
        }
        id(message_scroll)++;
        return;
      }

      // --- Clock & date -------------------------------------------------------
      auto now = id(home_time).now();
      int hour   = now.is_valid() ? now.hour   : 12;
      int minute = now.is_valid() ? now.minute : 34;
      int second = now.is_valid() ? now.second : 56;
      const bool use_12h = strcmp(id(time_format).current_option().c_str(), "12 hour") == 0;
      if (use_12h) {
        hour = hour % 12;
        if (hour == 0) hour = 12;
      }

      char content[6];
      if (mode == "Date") {
        int day   = now.is_valid() ? now.day_of_month : 25;
        int month = now.is_valid() ? now.month        : 12;
        snprintf(content, sizeof(content), "%02d.%02d", day, month);
      } else {
        snprintf(content, sizeof(content), "%02d:%02d", hour, minute);
        if (use_12h && hour < 10) content[0] = ' ';  // blank leading zero
      }

      // Seconds digits widen the block to 34 px so everything stays centered.
      const std::string seconds_mode = id(seconds_display).current_option();
      const bool show_seconds = mode == "Clock" && seconds_mode == "Digits";
      int block_width = 25 + (show_seconds ? 9 : 0);
      if (block_width > width) block_width = 25;  // small matrices: drop seconds

      int start_x = (width - block_width) / 2;
      if (strcmp(id(clock_alignment).current_option().c_str(), "Left") == 0) start_x = 0;
      if (strcmp(id(clock_alignment).current_option().c_str(), "Right") == 0) start_x = width - block_width;
      start_x = std::max(0, start_x);
      const int start_y = std::max(0, (height - 7) / 2);
      int cursor_x = start_x;

      for (int i = 0; i < 6 && content[i]; i++) {
        char character = content[i];
        if (character == ' ') {
          cursor_x += 6;
          continue;
        }
        if (character == ':') {
          // Blink the separator once each second (can be disabled from HA).
          const bool colon_on = !id(clock_blink).state || !now.is_valid() || now.second % 2 == 0;
          if (colon_on) {
            it.draw_pixel_at(cursor_x, start_y + 2, COLOR_ON);
            it.draw_pixel_at(cursor_x, start_y + 5, COLOR_ON);
          }
          cursor_x += 2;
          continue;
        }
        if (character == '.') {
          it.draw_pixel_at(cursor_x, start_y + 6, COLOR_ON);
          cursor_x += 2;
          continue;
        }
        draw_big_digit(character - '0', cursor_x, start_y);
        cursor_x += 6;
      }

      // Seconds counter painted in the tiny 3x5 font, right of the clock block.
      if (show_seconds) {
        int sx = start_x + 27;
        draw_small_digit(second / 10, sx, start_y + 2);
        draw_small_digit(second % 10, sx + 4, start_y + 2);
      }

      // Alternatively: a seconds progress bar along the bottom row.
      if (mode == "Clock" && seconds_mode == "Bar") {
        int lit = (int)((int32_t) width * second / 60);
        for (int x = 0; x < lit; x++) it.draw_pixel_at(x, height - 1, COLOR_ON);
      }
