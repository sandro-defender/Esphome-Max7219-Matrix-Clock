# Optional project-owned eight-row MAX7219 clock face.
substitutions:
  project_ref: 0.5.4
  project_repo: sandro-defender/Esphome-Max7219-Matrix-Clock
  fonts_base_url: https://raw.githubusercontent.com/${project_repo}/${project_ref}/fonts

font:
  - id: font_pixel_clock_6x8_source
    file:
      type: web
      url: ${fonts_base_url}/pixel-clock-6x8/PixelClock6x8.ttf
    size: 8
    bpp: 1
    glyphs:
      - '0123456789:.-/%!?+ '

esphome:
  build_flags:
    - -DMAX7219_FONT_PIXEL_CLOCK_6X8

select:
  - id: !extend clock_font
    options:
      - "Pixel Clock 6x8"
