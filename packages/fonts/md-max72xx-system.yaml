# Optional MD_MAX72XX System face. Source license is preserved under fonts/.
substitutions:
  project_ref: 0.5.0
  project_repo: sandro-defender/Esphome-Max7219-Matrix-Clock
  fonts_base_url: https://raw.githubusercontent.com/${project_repo}/${project_ref}/fonts

font:
  - id: font_md_max72xx_system_source
    file:
      type: web
      url: ${fonts_base_url}/md-max72xx-system/MDMax72xxSystem.ttf
    size: 8
    bpp: 1
    glyphs:
      - '0123456789:.-/%!?+ '

esphome:
  build_flags:
    - -DMAX7219_FONT_MD_MAX72XX_SYSTEM

select:
  - id: !extend clock_font
    options:
      - "MD MAX72XX System"
