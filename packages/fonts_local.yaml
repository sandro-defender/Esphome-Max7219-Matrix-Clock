# Default local-development font set. These five faces were measured with
# FreeType using ESPHome's pixel metrics: every digit is exactly eight rows
# high and worst-case 88:88:88 fits the default 48x8 panel.

font:
  - id: font_jersey_15_source
    file:
      type: local
      path: ../fonts/jersey-15/Jersey15-Regular.ttf
    size: 15
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_teko_source
    file:
      type: local
      path: ../fonts/teko/Teko[wght].ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_rajdhani_bold_source
    file:
      type: local
      path: ../fonts/rajdhani/Rajdhani-Bold.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_kdam_thmor_pro_source
    file:
      type: local
      path: ../fonts/kdam-thmor-pro/KdamThmorPro-Regular.ttf
    size: 9
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_rationale_source
    file:
      type: local
      path: ../fonts/rationale/Rationale-Regular.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "
