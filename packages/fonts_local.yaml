# Full local development/measurement catalogue (not the public default).

font:
  - id: font_md_parola_numeric_7seg_source
    file:
      type: local
      path: ../fonts/md-parola-numeric-7seg/MDParolaNumeric7Seg.ttf
    size: 8
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_md_max72xx_system_source
    file:
      type: local
      path: ../fonts/md-max72xx-system/MDMax72xxSystem.ttf
    size: 8
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_jersey_15_source
    file:
      type: local
      path: ../fonts/jersey-15/Jersey15-Regular.ttf
    size: 15
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_teko_source
    file:
      type: local
      path: ../fonts/teko/Teko[wght].ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_rajdhani_bold_source
    file:
      type: local
      path: ../fonts/rajdhani/Rajdhani-Bold.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_kdam_thmor_pro_source
    file:
      type: local
      path: ../fonts/kdam-thmor-pro/KdamThmorPro-Regular.ttf
    size: 9
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_rationale_source
    file:
      type: local
      path: ../fonts/rationale/Rationale-Regular.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  # Pixel font generated by scripts/generate_matrix_font.py: digits fill all
  # eight rows and every stroke is exactly two pixels thick on the matrix.
  - id: font_matrix_2px_source
    file:
      type: local
      path: ../fonts/matrix-2px/Matrix2px.ttf
    size: 8
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  # Original single-LED dot clock: 6x8 digits, with HH:MM fitting 32 columns.
  - id: font_dot_matrix_source
    file:
      type: local
      path: ../fonts/dot-matrix/DotMatrix.ttf
    size: 8
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_handjet_source
    file:
      type: local
      path: ../fonts/handjet/Handjet-Variable.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_oxanium_source
    file:
      type: local
      path: ../fonts/oxanium/Oxanium-Variable.ttf
    size: 11
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_share_tech_mono_source
    file:
      type: local
      path: ../fonts/share-tech-mono/ShareTechMono-Regular.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

esphome:
  build_flags:
    - -DMAX7219_FONT_MD_PAROLA_NUMERIC_7SEG
    - -DMAX7219_FONT_MD_MAX72XX_SYSTEM
    - -DMAX7219_FONT_JERSEY_15
    - -DMAX7219_FONT_TEKO
    - -DMAX7219_FONT_RAJDHANI_BOLD
    - -DMAX7219_FONT_KDAM_THMOR_PRO
    - -DMAX7219_FONT_RATIONALE
    - -DMAX7219_FONT_MATRIX_2PX
    - -DMAX7219_FONT_DOT_MATRIX
    - -DMAX7219_FONT_HANDJET
    - -DMAX7219_FONT_OXANIUM
    - -DMAX7219_FONT_SHARE_TECH_MONO

select:
  - id: !extend clock_font
    initial_option: "Dot Matrix"
    options:
      - "MD Parola Numeric 7-Segment"
      - "MD MAX72XX System"
      - "Jersey 15"
      - "Teko"
      - "Rajdhani Bold"
      - "Kdam Thmor Pro"
      - "Rationale"
      - "Matrix 2px"
      - "Dot Matrix"
      - "Handjet"
      - "Oxanium"
      - "Share Tech Mono"
