# Local development/measurement catalogue. Dot Matrix is the only default;
# Pixel Clock 6x8 and Matrix 2px are optional.
font:
  - id: font_pixel_clock_6x8_source
    file: { type: local, path: ../fonts/pixel-clock-6x8/PixelClock6x8.ttf }
    size: 8
    bpp: 1
    glyphs: ["0123456789:.-/%!?+ "]
  - id: font_matrix_2px_source
    file: { type: local, path: ../fonts/matrix-2px/Matrix2px.ttf }
    size: 8
    bpp: 1
    glyphs: ["0123456789:.-/%!?+ "]
  - id: font_dot_matrix_source
    file: { type: local, path: ../fonts/dot-matrix/DotMatrix.ttf }
    size: 8
    bpp: 1
    glyphs: ["0123456789:.-/%!?+ "]
esphome:
  build_flags:
    - -DMAX7219_FONT_PIXEL_CLOCK_6X8
    - -DMAX7219_FONT_MATRIX_2PX
    - -DMAX7219_FONT_DOT_MATRIX
select:
  - id: !extend clock_font
    initial_option: "Dot Matrix"
    options: ["Pixel Clock 6x8", "Matrix 2px", "Dot Matrix"]
