# GENERATED measurement catalogue; not the default firmware entry point.
font:
- id: font_pixel_clock_6x8_source
  file:
    type: local
    path: ../fonts/pixel-clock-6x8/PixelClock6x8.ttf
  size: 8
  bpp: 1
  glyphs:
  - '0123456789:.-/%!?+ '
- id: font_matrix_2px_source
  file:
    type: local
    path: ../fonts/matrix-2px/Matrix2px.ttf
  size: 8
  bpp: 1
  glyphs:
  - '0123456789:.-/%!?+ '
- id: font_md_parola_numeric_7seg_source
  file:
    type: local
    path: ../fonts/md-parola-numeric-7seg/MDParolaNumeric7Seg.ttf
  size: 8
  bpp: 1
  glyphs:
  - '0123456789:.-/%!?+ '
- id: font_md_max72xx_system_source
  file:
    type: local
    path: ../fonts/md-max72xx-system/MDMax72xxSystem.ttf
  size: 8
  bpp: 1
  glyphs:
  - '0123456789:.-/%!?+ '
- id: font_dot_matrix_source
  file:
    type: local
    path: ../fonts/dot-matrix/DotMatrix.ttf
  size: 8
  bpp: 1
  glyphs:
  - '0123456789:.-/%!?+ '
- id: font_mg_minecraft_georgian_source
  file:
    type: local
    path: ../fonts/mg-minecraft-georgian-regular.ttf
  size: 8
  bpp: 1
  glyphs:
  - 0123456789:.-/%!?+ აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ
esphome:
  build_flags:
  - -DMAX7219_FONT_PIXEL_CLOCK_6X8
  - -DMAX7219_FONT_MATRIX_2PX
  - -DMAX7219_FONT_MD_PAROLA_NUMERIC_7SEG
  - -DMAX7219_FONT_MD_MAX72XX_SYSTEM
  - -DMAX7219_FONT_DOT_MATRIX
  - -DMAX7219_FONT_MG_MINECRAFT_GEORGIAN
select:
- id: !extend 'clock_font'
  initial_option: Pixel Clock 6x8
  options:
  - Pixel Clock 6x8
  - Matrix 2px
  - MD Parola Numeric 7-Segment
  - MD MAX72XX System
  - Dot Matrix
  - MG Minecraft Georgian
