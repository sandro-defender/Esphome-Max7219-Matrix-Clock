# Encrypted native OTA; the local API key is reused, never embedded here.
# Official 2026.9.1: x is 0..100, OTA blocks loop(), and on_end runs just before
# reboot. The renderer calls MAX7219::display() synchronously from update().
ota:
  - platform: esphome
    id: ota_component
    port: ${ota_port}
    encryption:
      key: ${api_encryption_key}
    on_begin:
      - script.stop: ota_error_timeout
      - lambda: |-
          max7219_clock::state.begin_ota(id(matrix_display_power).state);
          id(matrix).update();
    on_progress:
      - lambda: |-
          if (max7219_clock::set_ota_progress(x)) id(matrix).update();
    on_end:
      - lambda: |-
          max7219_clock::state.ota_state = max7219_clock::OTA_SUCCESS;
          max7219_clock::state.ota_percent = 100;
          id(matrix).update();
          // Only AFTER a successful transfer: give humans time to see 100%.
          // An asynchronous script/delay cannot hold a rebooting OTA callback.
          delay(1000);
    on_error:
      - lambda: |-
          max7219_clock::state.ota_state = max7219_clock::OTA_ERROR;
          max7219_clock::state.ota_error = x;
          id(matrix).update();
      - script.execute: ota_error_timeout
    on_abort:
      - lambda: |-
          max7219_clock::state.ota_state = max7219_clock::OTA_ERROR;
          max7219_clock::state.ota_error = 0;
          id(matrix).update();
      - script.execute: ota_error_timeout
