# Network, API and time module.
#
# Credentials arrive as substitutions from the user's YAML; an ESPHome remote
# package cannot resolve !secret itself. Never put a real credential in here.

substitutions:
  # SSID of the clock's own fallback hotspot (not a credential).
  fallback_ap_ssid: MAX7219 Clock Fallback
  fallback_ap_timeout: 15min
  wifi_reboot_timeout: 15min
  wifi_power_save_mode: none
  api_reboot_timeout: 15min
  sntp_server_1: 0.pool.ntp.org
  sntp_server_2: 1.pool.ntp.org
  sntp_update_interval: 1h

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # A fallback access point keeps the clock reachable if the network is gone.
  ap:
    ssid: ${fallback_ap_ssid}
    password: ${fallback_ap_password}
    ap_timeout: ${fallback_ap_timeout}
  reboot_timeout: ${wifi_reboot_timeout}
  power_save_mode: ${wifi_power_save_mode}

api:
  encryption:
    key: ${api_encryption_key}
  reboot_timeout: ${api_reboot_timeout}

# Two time sources: Home Assistant is authoritative while it is connected, SNTP
# keeps the clock running when Home Assistant is not. The renderer falls back
# to the SNTP time (and then to a "--:--" placeholder) transparently.
time:
  - platform: homeassistant
    id: home_time
    timezone: ${timezone}
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - ${sntp_server_1}
      - ${sntp_server_2}
    update_interval: ${sntp_update_interval}

# A numeric Home Assistant sensor selected in the installer. The display shows
# its value with one decimal place; use a Celsius entity for a °C reading.
sensor:
  - platform: homeassistant
    id: temperature_sensor
    entity_id: ${temperature_entity}
    internal: true
