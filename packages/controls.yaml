# Home Assistant controls module.
#
# Only real runtime capabilities are exposed here. Board type, pins, chip
# count, row count and wiring stay compile-time substitutions (see base.yaml).
# Names and ids that existed in the single-file firmware are kept so existing
# Home Assistant dashboards and automations keep working.

select:
  # Existing entity from v2.0: also selects the wiring/pixel test patterns.
  - platform: template
    name: "Screen"
    id: screen_mode
    internal: ${ha_hide_screen_mode}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "Clock"
    options:
      - "Clock"
      - "Date"
      - "Temperature"
      - "Message"
      - "Module grid test"
      - "Pixel checkerboard"
    set_action:
      - lambda: |-
          // Selecting Message by hand shows the current message until it is
          // cleared; every other option is a normal screen.
          const std::string option = id(screen_mode).current_option();
          if (option == "Message") {
            if (max7219_clock::state.message_text[0] == '\0') {
              max7219_clock::state.set_message("MAX7219 CLOCK", 0, millis());
            } else {
              max7219_clock::state.message_active = true;
            }
          } else {
            max7219_clock::state.clear_message();
            max7219_clock::state.clear_alert();
          }
      - component.update: matrix

  - platform: template
    name: "Clock alignment"
    id: clock_alignment
    internal: ${ha_hide_clock_alignment}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "Center"
    options:
      - "Left"
      - "Center"
      - "Right"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Time format"
    id: time_format
    internal: ${ha_hide_time_format}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "24 hour"
    options:
      - "24 hour"
      - "12 hour"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Seconds display"
    id: seconds_display
    internal: ${ha_hide_seconds_display}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "Digits"
    options:
      - "Off"
      - "Digits"
      - "Bar"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Date format"
    id: date_format
    internal: ${ha_hide_date_format}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "DD.MM"
    options:
      - "DD.MM"
      - "MM/DD"
      - "DD/MM"
      - "DD.MM.YY"
      - "Weekday DD.MM.YY"
      - "Weekday DD. MMM YY"
      - "Weekday MMM.DD"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Clock font"
    id: clock_font
    internal: ${ha_hide_clock_font}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "Compact 5x7"
    # Each included face extends this list; the fallback needs no font component.
    options:
      - "Compact 5x7"
    set_action:
      - component.update: matrix

  - platform: template
    name: "Message scroll"
    id: message_scroll_behavior
    internal: ${ha_hide_message_scroll_behavior}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_option: "Scroll"
    options:
      - "Scroll"
      - "Static"
    set_action:
      - component.update: matrix

