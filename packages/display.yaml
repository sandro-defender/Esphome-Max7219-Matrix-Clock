# Display hardware module: SPI bus, MAX7219 panel and the renderer bridge.
#
# The lambda stays deliberately small and allocation free: it copies entity
# states into a Frame, hands it to the pure renderer and publishes the small
# set of values the renderer reports as changed.

spi:
  clk_pin: ${matrix_clk_pin}
  mosi_pin: ${matrix_mosi_pin}

display:
  - platform: max7219digit
    id: matrix
    cs_pin: ${matrix_cs_pin}
    num_chips: ${matrix_chips}
    num_chip_lines: ${matrix_rows}
    chip_lines_style: ${matrix_wiring}
    rotate_chip: ${matrix_rotate_chip}
    reverse_enable: ${matrix_reverse_enable}
    flip_x: ${matrix_flip_x}
    intensity: ${matrix_intensity}
    # The renderer owns scrolling and animation; the component's own scrolling
    # must stay off so pixels are never moved behind the state machine's back.
    scroll_enable: false
    update_interval: ${display_update_interval}
    lambda: |-
      // No driver scrolling: avoid repeatedly flushing unchanged frames from
      // MAX7219::loop(). This writer owns rendering AND synchronous flushing.
      it.disable_loop();
      const uint32_t now_ms = millis();

      // ----- Frame: time source (Home Assistant, then SNTP) ---------------
      max7219_clock::Frame frame;
      frame.now_ms = now_ms;
      ESPTime time_now = id(home_time).now();
      if (!time_now.is_valid()) {
        time_now = id(sntp_time).now();
      }
      frame.time_valid = time_now.is_valid();
      if (frame.time_valid) {
        frame.hour = time_now.hour;
        frame.minute = time_now.minute;
        frame.second = time_now.second;
        frame.day = time_now.day_of_month;
        frame.month = time_now.month;
        frame.year = time_now.year;
      }
      frame.temperature_valid = !max7219_clock::is_nan(id(temperature_sensor).state);
      frame.temperature_c = id(temperature_sensor).state;
      frame.home_temperature_valid = max7219_clock::parse_temperature_text(
          id(home_temperature_text).state.c_str(), frame.home_temperature);
      float dedicated_outdoor_temperature = 0.0f;
      const bool dedicated_outdoor_valid = max7219_clock::parse_temperature_text(
          id(outdoor_temperature_text).state.c_str(), dedicated_outdoor_temperature);
      float weather_temperature = 0.0f;
      const bool weather_temperature_valid = max7219_clock::parse_temperature_text(
          id(weather_temperature_text).state.c_str(), weather_temperature);
      frame.outdoor_temperature_valid = max7219_clock::choose_outdoor_temperature(
          dedicated_outdoor_valid, dedicated_outdoor_temperature, weather_temperature_valid,
          weather_temperature, frame.outdoor_temperature);
      frame.weather_condition = max7219_clock::weather_from_condition(
          id(weather_condition_text).state.c_str());

      // ----- Frame: durable preferences (restored entities) ---------------
      frame.screen = max7219_clock::screen_from_option(id(screen_mode).current_option());
      frame.alignment = max7219_clock::alignment_from_option(id(clock_alignment).current_option());
      frame.seconds_mode = max7219_clock::seconds_from_option(id(seconds_display).current_option());
      frame.clock_layout = max7219_clock::clock_layout_from_option(id(clock_layout).current_option());
      frame.date_show_weather_icon = id(date_show_weather_icon).state;
      frame.date_show_outdoor_temperature = id(date_show_outdoor_temperature).state;
      frame.show_temperature_degree = id(show_temperature_degree).state;
      frame.date_format = max7219_clock::date_format_from_option(id(date_format).current_option());
      frame.date_language = max7219_clock::date_language_from_option(id(date_language).current_option());
      frame.clock_digit_style = max7219_clock::digit_style_from_option(id(clock_digit_style).current_option());
      frame.clock_letter_style = max7219_clock::letter_style_from_option(id(clock_letter_style).current_option());
      frame.date_digit_style = max7219_clock::digit_style_from_option(id(date_digit_style).current_option());
      frame.temp_digit_style = max7219_clock::digit_style_from_option(id(temp_digit_style).current_option());
      frame.temp_letter_style = max7219_clock::letter_style_from_option(id(temp_letter_style).current_option());
      frame.message_digit_style = max7219_clock::digit_style_from_option(id(message_digit_style).current_option());
      frame.message_letter_style = max7219_clock::letter_style_from_option(id(message_letter_style).current_option());
      frame.use_12h = id(time_format).current_option() == "12 hour";
      frame.blink_colon = id(clock_blink).state;
      frame.animate = id(clock_animate).state;
      frame.animation_ms = max7219_clock::clamp_u32((int) id(animation_duration).state, 0, 2000);
      frame.animation_row_gap = max7219_clock::clamp_u8((int) id(animation_row_gap).state, 0, 2);
      frame.screen_transition_style = max7219_clock::screen_transition_style_from_option(id(screen_transition_style).current_option());
      frame.message_scroll = id(message_scroll_behavior).current_option() == "Scroll";
      frame.scroll_ms_per_px = max7219_clock::clamp_u32((int) id(message_scroll_speed).state, 20, 200);
      frame.date_scroll_ms_per_px = max7219_clock::clamp_u32((int) id(date_scroll_speed).state, 20, 200);
      frame.ota_brightness = ${ota_display_intensity};
      frame.night_manual = id(night_mode).state;
      frame.alarm_mode = id(alarm_mode).state;
      frame.night_schedule = id(night_schedule_enabled).state;
      frame.night_start_hour = (int) id(night_start_hour).state;
      frame.night_end_hour = (int) id(night_end_hour).state;
      frame.brightness_day = id(matrix_brightness).state;
      frame.brightness_night = id(night_brightness).state;
      frame.auto_cycle = id(auto_cycle).state;
      frame.cycle_interval_s = (uint32_t) id(screen_cycle_interval).state;
      frame.date_cycle_interval_s = (uint32_t) id(date_screen_duration).state;

      // ----- Draw ----------------------------------------------------------
      max7219_clock::DisplayCanvas canvas(it);
      max7219_clock::BuiltinFont builtin_font;
      const StringRef font_option = id(clock_font).current_option();
      const StringRef date_font_option = id(date_font).current_option();
      const StringRef temp_font_option = id(temp_font).current_option();
      const StringRef message_font_option = id(message_font).current_option();
      max7219_clock::GlyphFont *selected = &builtin_font;
      max7219_clock::GlyphFont *selected_date = &builtin_font;
      max7219_clock::GlyphFont *selected_temp = &builtin_font;
      max7219_clock::GlyphFont *selected_message = &builtin_font;
      // Raw generated pointers intentionally avoid id() resolution for omitted faces.
      #ifdef MAX7219_FONT_MAX7219
      max7219_clock::SourceFont max7219_font(font_max7219_source, &it);
      if (font_option == "max7219") selected = &max7219_font;
      if (date_font_option == "max7219") selected_date = &max7219_font;
      if (temp_font_option == "max7219") selected_temp = &max7219_font;
      if (message_font_option == "max7219") selected_message = &max7219_font;
      #endif
      max7219_clock::ScreenFonts screen_fonts{selected, selected_date, selected_temp, selected_message};
      max7219_clock::render(canvas, *selected, builtin_font, frame, max7219_clock::report, &screen_fonts);

      // ----- Publish only what changed (keeps API traffic low) ------------
      if (max7219_clock::report.mode_changed) {
        id(display_mode).publish_state(max7219_clock::report.mode_name);
        switch (max7219_clock::report.mode) {
          case max7219_clock::MODE_CLOCK:
          case max7219_clock::MODE_DATE:
          case max7219_clock::MODE_TEMPERATURE:
          case max7219_clock::MODE_GRID_TEST:
          case max7219_clock::MODE_PIXEL_TEST:
            id(screen_mode).publish_state(
                max7219_clock::option_for_screen(max7219_clock::screen_from_mode(max7219_clock::report.mode)));
            break;
          default:
            break;
        }
      }
      if (max7219_clock::report.ota_state_changed) {
        id(ota_state).publish_state(max7219_clock::report.ota_state_name);
      }
      if (max7219_clock::report.percent_changed) {
        id(ota_percent).publish_state(max7219_clock::report.percent);
      }
      if (max7219_clock::report.remaining_changed) {
        if (max7219_clock::report.remaining_s < 0) {
          id(countdown_remaining).publish_state(NAN);
        } else {
          id(countdown_remaining).publish_state(max7219_clock::report.remaining_s);
        }
      }
      if (max7219_clock::report.brightness_changed) {
        id(matrix).intensity(max7219_clock::clamp_u8(max7219_clock::report.brightness, 0, 15));
      }
      if (max7219_clock::report.screen_changed) {
        id(screen_mode).publish_state(max7219_clock::option_for_screen(max7219_clock::report.screen));
      }

      // Render -> hardware flush in the same call. MAX7219::update() only
      // writes RAM; display() is required while OTA blocks the driver loop.
      const bool overlay = max7219_clock::state.ota_state != max7219_clock::OTA_IDLE ||
                           max7219_clock::state.boot_active;
      const bool powered = overlay || id(matrix_display_power).state;
      const bool inverted = !overlay && id(display_inversion).state;
      if (max7219_clock::state.applied_power != (int) powered) {
        it.turn_on_off(powered);
        max7219_clock::state.applied_power = powered;
      }
      if (max7219_clock::state.applied_inversion != (int) inverted) {
        it.invert_on_off(inverted);
        max7219_clock::state.applied_inversion = inverted;
      }
      it.display();
