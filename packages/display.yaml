# Display hardware module: SPI bus, MAX7219 panel and the renderer bridge.
#
# The lambda stays deliberately small and allocation free: it copies entity
# states into a Frame, hands it to the pure renderer and publishes the small
# set of values the renderer reports as changed.

spi:
  clk_pin: ${matrix_clk_pin}
  mosi_pin: ${matrix_mosi_pin}

display:
  - platform: max7219digit
    id: matrix
    cs_pin: ${matrix_cs_pin}
    num_chips: ${matrix_chips}
    num_chip_lines: ${matrix_rows}
    chip_lines_style: ${matrix_wiring}
    rotate_chip: ${matrix_rotate_chip}
    flip_x: ${matrix_flip_x}
    intensity: ${matrix_intensity}
    # The renderer owns scrolling and animation; the component's own scrolling
    # must stay off so pixels are never moved behind the state machine's back.
    scroll_enable: false
    update_interval: ${display_update_interval}
    lambda: |-
      const uint32_t now_ms = millis();

      // ----- Frame: time source (Home Assistant, then SNTP) ---------------
      max7219_clock::Frame frame;
      frame.now_ms = now_ms;
      ESPTime time_now = id(home_time).now();
      if (!time_now.is_valid()) {
        time_now = id(sntp_time).now();
      }
      frame.time_valid = time_now.is_valid();
      if (frame.time_valid) {
        frame.hour = time_now.hour;
        frame.minute = time_now.minute;
        frame.second = time_now.second;
        frame.day = time_now.day_of_month;
        frame.month = time_now.month;
      }

      // ----- Frame: durable preferences (restored entities) ---------------
      frame.screen = max7219_clock::screen_from_option(id(screen_mode).current_option());
      frame.alignment = max7219_clock::alignment_from_option(id(clock_alignment).current_option());
      frame.seconds_mode = max7219_clock::seconds_from_option(id(seconds_display).current_option());
      frame.date_format = max7219_clock::date_format_from_option(id(date_format).current_option());
      frame.use_12h = id(time_format).current_option() == "12 hour";
      frame.blink_colon = id(clock_blink).state;
      frame.animate = id(clock_animate).state;
      frame.animation_ms = max7219_clock::clamp_u32((int) id(animation_duration).state, 0, 2000);
      frame.message_scroll = id(message_scroll_behavior).current_option() == "Scroll";
      frame.scroll_ms_per_px = max7219_clock::clamp_u32((int) id(message_scroll_speed).state, 20, 200);
      frame.night_manual = id(night_mode).state;
      frame.night_schedule = id(night_schedule_enabled).state;
      frame.night_start_hour = (int) id(night_start_hour).state;
      frame.night_end_hour = (int) id(night_end_hour).state;
      frame.brightness_day = id(matrix_brightness).state;
      frame.brightness_night = id(night_brightness).state;
      frame.auto_cycle = id(auto_cycle).state;
      frame.cycle_interval_s = (uint32_t) id(screen_cycle_interval).state;

      // ----- Draw ----------------------------------------------------------
      max7219_clock::DisplayCanvas canvas(it);
      max7219_clock::SourceFont tiny5_font(font_tiny5_source, &it);
      max7219_clock::SourceFont ps2p_font(font_ps2p_source, &it);
      max7219_clock::SourceFont silkscreen_bold_font(font_silkscreen_bold_source, &it);
      max7219_clock::SourceFont audiowide_font(font_audiowide_source, &it);
      max7219_clock::SourceFont bitcount_grid_double_font(font_bitcount_grid_double_source, &it);
      max7219_clock::SourceFont bitcount_grid_single_font(font_bitcount_grid_single_source, &it);
      max7219_clock::SourceFont bitcount_prop_double_font(font_bitcount_prop_double_source, &it);
      max7219_clock::SourceFont bitcount_prop_single_font(font_bitcount_prop_single_source, &it);
      max7219_clock::SourceFont bitcount_single_font(font_bitcount_single_source, &it);
      max7219_clock::SourceFont bytesized_font(font_bytesized_source, &it);
      max7219_clock::SourceFont dotgothic16_font(font_dotgothic16_source, &it);
      max7219_clock::SourceFont doto_font(font_doto_source, &it);
      max7219_clock::SourceFont electrolize_font(font_electrolize_source, &it);
      max7219_clock::SourceFont handjet_font(font_handjet_source, &it);
      max7219_clock::SourceFont iceland_font(font_iceland_source, &it);
      max7219_clock::SourceFont jersey_10_font(font_jersey_10_source, &it);
      max7219_clock::SourceFont jersey_15_font(font_jersey_15_source, &it);
      max7219_clock::SourceFont jersey_20_font(font_jersey_20_source, &it);
      max7219_clock::SourceFont jersey_25_font(font_jersey_25_source, &it);
      max7219_clock::SourceFont major_mono_display_font(font_major_mono_display_source, &it);
      max7219_clock::SourceFont micro_5_font(font_micro_5_source, &it);
      max7219_clock::SourceFont nova_mono_font(font_nova_mono_source, &it);
      max7219_clock::SourceFont orbitron_font(font_orbitron_source, &it);
      max7219_clock::SourceFont oxanium_font(font_oxanium_source, &it);
      max7219_clock::SourceFont pixelify_sans_font(font_pixelify_sans_source, &it);
      max7219_clock::SourceFont quantico_bold_font(font_quantico_bold_source, &it);
      max7219_clock::SourceFont rubik_pixels_font(font_rubik_pixels_source, &it);
      max7219_clock::SourceFont share_tech_mono_font(font_share_tech_mono_source, &it);
      max7219_clock::SourceFont sixtyfour_font(font_sixtyfour_source, &it);
      max7219_clock::SourceFont vt323_font(font_vt323_source, &it);
      max7219_clock::SourceFont wallpoet_font(font_wallpoet_source, &it);
      max7219_clock::SourceFont noto_sans_georgian_font(font_noto_sans_georgian_source, &it);
      max7219_clock::SourceFont noto_serif_georgian_font(font_noto_serif_georgian_source, &it);
      max7219_clock::BuiltinFont builtin_font;
      // StringRef: a view on the codegen literals, so no per-frame allocation.
      const StringRef font_option = id(clock_font).current_option();
      max7219_clock::GlyphFont *selected = &builtin_font;
      if (font_option == "Tiny5") {
        selected = &tiny5_font;
      } else if (font_option == "Press Start 2P") {
        selected = &ps2p_font;
      } else if (font_option == "Silkscreen Bold") {
        selected = &silkscreen_bold_font;
      } else if (font_option == "Audiowide") {
        selected = &audiowide_font;
      } else if (font_option == "Bitcount Grid Double") {
        selected = &bitcount_grid_double_font;
      } else if (font_option == "Bitcount Grid Single") {
        selected = &bitcount_grid_single_font;
      } else if (font_option == "Bitcount Prop Double") {
        selected = &bitcount_prop_double_font;
      } else if (font_option == "Bitcount Prop Single") {
        selected = &bitcount_prop_single_font;
      } else if (font_option == "Bitcount Single") {
        selected = &bitcount_single_font;
      } else if (font_option == "Bytesized") {
        selected = &bytesized_font;
      } else if (font_option == "DotGothic16") {
        selected = &dotgothic16_font;
      } else if (font_option == "Doto") {
        selected = &doto_font;
      } else if (font_option == "Electrolize") {
        selected = &electrolize_font;
      } else if (font_option == "Handjet") {
        selected = &handjet_font;
      } else if (font_option == "Iceland") {
        selected = &iceland_font;
      } else if (font_option == "Jersey 10") {
        selected = &jersey_10_font;
      } else if (font_option == "Jersey 15") {
        selected = &jersey_15_font;
      } else if (font_option == "Jersey 20") {
        selected = &jersey_20_font;
      } else if (font_option == "Jersey 25") {
        selected = &jersey_25_font;
      } else if (font_option == "Major Mono Display") {
        selected = &major_mono_display_font;
      } else if (font_option == "Micro 5") {
        selected = &micro_5_font;
      } else if (font_option == "Nova Mono") {
        selected = &nova_mono_font;
      } else if (font_option == "Orbitron") {
        selected = &orbitron_font;
      } else if (font_option == "Oxanium") {
        selected = &oxanium_font;
      } else if (font_option == "Pixelify Sans") {
        selected = &pixelify_sans_font;
      } else if (font_option == "Quantico Bold") {
        selected = &quantico_bold_font;
      } else if (font_option == "Rubik Pixels") {
        selected = &rubik_pixels_font;
      } else if (font_option == "Share Tech Mono") {
        selected = &share_tech_mono_font;
      } else if (font_option == "Sixtyfour") {
        selected = &sixtyfour_font;
      } else if (font_option == "VT323") {
        selected = &vt323_font;
      } else if (font_option == "Wallpoet") {
        selected = &wallpoet_font;
      } else if (font_option == "Noto Sans Georgian") {
        selected = &noto_sans_georgian_font;
      } else if (font_option == "Noto Serif Georgian") {
        selected = &noto_serif_georgian_font;
      }
      max7219_clock::render(canvas, *selected, builtin_font, frame, max7219_clock::report);

      // ----- Publish only what changed (keeps API traffic low) ------------
      if (max7219_clock::report.mode_changed) {
        id(display_mode).publish_state(max7219_clock::report.mode_name);
        switch (max7219_clock::report.mode) {
          case max7219_clock::MODE_CLOCK:
          case max7219_clock::MODE_DATE:
          case max7219_clock::MODE_GRID_TEST:
          case max7219_clock::MODE_PIXEL_TEST:
            id(screen_mode).publish_state(
                max7219_clock::option_for_screen(max7219_clock::screen_from_mode(max7219_clock::report.mode)));
            break;
          default:
            break;
        }
      }
      if (max7219_clock::report.ota_state_changed) {
        id(ota_state).publish_state(max7219_clock::report.ota_state_name);
      }
      if (max7219_clock::report.percent_changed) {
        id(ota_percent).publish_state(max7219_clock::report.percent);
      }
      if (max7219_clock::report.remaining_changed) {
        if (max7219_clock::report.remaining_s < 0) {
          id(countdown_remaining).publish_state(NAN);
        } else {
          id(countdown_remaining).publish_state(max7219_clock::report.remaining_s);
        }
      }
      if (max7219_clock::report.brightness_changed) {
        id(matrix).intensity(max7219_clock::clamp_u8(max7219_clock::report.brightness, 0, 15));
      }
      if (max7219_clock::report.screen_changed) {
        id(screen_mode).publish_state(
            max7219_clock::screen_from_mode(max7219_clock::report.screen) == max7219_clock::SCREEN_DATE ? "Date"
                                                                                                        : "Clock");
      }
