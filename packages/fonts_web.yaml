# Font module (release build): downloads the bundled fonts from this repository.
#
# Release examples pin ${project_ref} to the same tag as the package files, so a
# build never mixes main-branch font assets with a tagged package release. The
# development entry point uses fonts_local.yaml instead.
#
# Every face is measured against the 48x8 panel (see fonts/README.md). All use
# bpp: 1 and compile only clock/status glyphs. Latin messages fall back to the
# built-in compact font; the two Georgian faces additionally compile Mkhedruli
# and Mtavruli. Keeping Latin letters out of every external face is necessary
# for the complete catalogue to fit the ESP8266 RAM budget.

substitutions:
  # Keep in sync with the tag used by the remote `packages` ref.
  project_ref: "0.2.0"
  project_repo: sandro-defender/Esphome-Max7219-Matrix-Clock
  # Overridable for offline builds/validation (see VALIDATION.md).
  fonts_base_url: https://raw.githubusercontent.com/${project_repo}/${project_ref}/fonts

font:
  - id: font_tiny5_source
    file:
      type: web
      url: ${fonts_base_url}/tiny5/Tiny5-Regular.ttf
    size: 10
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_ps2p_source
    file:
      type: web
      url: ${fonts_base_url}/press-start-2p/PressStart2P-Regular.ttf
    size: 6
    bpp: 1
