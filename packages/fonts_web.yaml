# Release font set. Font assets are downloaded from the same pinned repository
# tag as the package files. All five external faces draw exact eight-row digits
# and fit worst-case 88:88:88 on the default 48x8 panel.

substitutions:
  project_ref: "0.3.0"
  project_repo: sandro-defender/Esphome-Max7219-Matrix-Clock
  fonts_base_url: https://raw.githubusercontent.com/${project_repo}/${project_ref}/fonts

font:
  - id: font_jersey_15_source
    file:
      type: web
      url: ${fonts_base_url}/jersey-15/Jersey15-Regular.ttf
    size: 15
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_teko_source
    file:
      type: web
      url: ${fonts_base_url}/teko/Teko[wght].ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_rajdhani_bold_source
    file:
      type: web
      url: ${fonts_base_url}/rajdhani/Rajdhani-Bold.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_kdam_thmor_pro_source
    file:
      type: web
      url: ${fonts_base_url}/kdam-thmor-pro/KdamThmorPro-Regular.ttf
    size: 9
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "

  - id: font_rationale_source
    file:
      type: web
      url: ${fonts_base_url}/rationale/Rationale-Regular.ttf
    size: 12
    bpp: 1
    glyphs:
      - "0123456789:.-/%!?+ "
