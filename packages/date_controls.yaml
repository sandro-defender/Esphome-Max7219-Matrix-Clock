# Date-specific controls stay separate so the general control module remains
# focused and below the project's module-size guard.

number:
  - platform: template
    name: "Date scroll speed"
    id: date_scroll_speed
    internal: ${ha_hide_date_scroll_speed}
    entity_category: config
    optimistic: true
    restore_value: true
    update_interval: never
    initial_value: ${date_ms_per_px}
    min_value: 20
    max_value: 200
    step: 5
    unit_of_measurement: ms/px
    set_action:
      - component.update: matrix

switch:
  - platform: template
    name: "Show temperature degree symbol"
    id: show_temperature_degree
    internal: ${ha_hide_show_temperature_degree}
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: request_matrix_refresh
    turn_off_action:
      - script.execute: request_matrix_refresh

  - platform: template
    name: "Show weather icon on date"
    id: date_show_weather_icon
    internal: ${ha_hide_date_show_weather_icon}
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: request_matrix_refresh
    turn_off_action:
      - script.execute: request_matrix_refresh

  - platform: template
    name: "Show outdoor temperature on date"
    id: date_show_outdoor_temperature
    internal: ${ha_hide_date_show_outdoor_temperature}
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: request_matrix_refresh
    turn_off_action:
      - script.execute: request_matrix_refresh

