# Renderer/state module.
#
# The C++ renderer (packages/max7219_clock_renderer.h) owns the display state
# machine, layout, animation, scrolling and the OTA screens. This module only
# adds the two headers to the build and the scripts that the overlay packages
# (OTA UI, controls) use, so no temporary runtime state is ever written to
# flash: only the durable preferences live in the template entities.

esphome:
  includes:
    # Relative paths inside a package resolve against that package's own
    # directory, so these are fetched with the package.
    - max7219_clock_renderer.h
    - max7219_clock_esphome.h

script:
  # Factory reset actions are generated from controls + selected default fonts
  # in restore_defaults.generated.yaml; no second copy of preference defaults.

  # Show the OTA error screen for a few seconds, then restore the previous
  # screen and display power state (Phase 10).
  - id: ota_error_timeout
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          max7219_clock::state.ota_state = max7219_clock::OTA_IDLE;
      - component.update: matrix
